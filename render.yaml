# Render Blueprint — deploys the FloodWatch FastAPI backend as a web service.
# In the Render dashboard: New > Blueprint, point it at this repo.
services:
  - type: web
    name: community-watch-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URI
        sync: false            # set this in the dashboard (secret)
      - key: SIMULATOR_ENABLED
        value: "false"   # single real ESP32 demo — keep this off in production
      - key: CORS_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: DEVICE_API_KEYS
        sync: false            # comma-separated shared secret(s) for X-Device-Key
